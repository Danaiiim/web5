<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Assignment 5. JavaScript Basics</h1>

    <div class="section">
        <h2>My Profile</h2>
        <p>Name: <span id="profileName"></span></p>
        <p>Birth year: <span id="profileYear"></span></p>
        <p>Developer: <span id="profileDev"></span></p>
        <p>Hobbies: <span id="profileHobbies"></span></p>
        <p>Age: <span id="profileAge"></span></p>
        <p>Months old: <span id="profileMonths"></span></p>
        <p>Hobbies count: <span id="profileCount"></span></p>
    </div>

    <div class="section">
        <h2>Update Profile</h2>
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Enter your name">
        <br><br>
        <label for="birthYear">Birth Year:</label>
        <input type="number" id="birthYear" min="1900" max="2026" placeholder="Enter birth year">
        <br><br>
        <button type="button" id="updateBtn">Create / Update Profile</button>
        <p id="message"></p>
    </div>

    <div class="section">
        <h2>My Tasks</h2>
        <ul id="taskList">
            <li>Do homework</li>
            <li>Go to the gym</li>
            <li>Edit a video</li>
        </ul>
        <input type="text" id="newItem" placeholder="New task">
        <button type="button" id="addBtn">Add Item</button>
        <button type="button" id="removeBtn">Remove Item</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
